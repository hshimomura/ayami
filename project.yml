name: Ayami

options:
  bundleIdPrefix: io.github.hshimomura
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  xcodeVersion: "27.1"

configs:
  Debug: debug
  Release: release
  UIValidation: debug

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  SwiftUIMath:
    url: https://github.com/gonzalezreal/swiftui-math
    exactVersion: 0.1.0
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    exactVersion: 1.4.3

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"

targets:
  Ayami:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ayami
        excludes:
          - Resources
      - path: Sources/Ayami/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.xcassets
        buildPhase: resources
      - path: Packaging/Localizations
        buildPhase: resources
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Legal
        buildPhase: resources
        type: folder
    dependencies:
      - package: Textual
      - target: AyamiQuickLook
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Packaging/Ayami.entitlements
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        CURRENT_PROJECT_VERSION: "19"
        DEVELOPMENT_TEAM: ZLX73742D3
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info.plist
        MARKETING_VERSION: "1.4"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewer
        PRODUCT_MODULE_NAME: Ayami
        PRODUCT_NAME: Ayami
        SWIFT_STRICT_CONCURRENCY: complete

  AyamiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AyamiTests
    dependencies:
      - target: Ayami
    settings:
      base:
        ARCHS: arm64
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ayami.app/Contents/MacOS/Ayami"

  AyamiIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Ayami
        excludes:
          - Resources
          - AyamiMacApp.swift
          - WindowSizeRestorer.swift
      - path: Sources/AyamiIOS
      - path: Sources/Ayami/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.xcassets
        buildPhase: resources
      - path: Packaging/Localizations
        buildPhase: resources
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Legal
        buildPhase: resources
        type: folder
    dependencies:
      - package: Textual
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "19"
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info-iOS.plist
        MARKETING_VERSION: "1.4"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewer
        PRODUCT_MODULE_NAME: Ayami
        PRODUCT_NAME: Ayami
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete

  AyamiIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AyamiTests
        excludes:
          - MarkdownDocumentTests.swift
      - path: Tests/AyamiIOSTests
    dependencies:
      - target: AyamiIOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewerIOSTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ayami.app/Ayami"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AyamiIOSUITestHost:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Ayami
        excludes:
          - Resources
          - AyamiMacApp.swift
          - WindowSizeRestorer.swift
      - path: Tests/AyamiIOSUITestHost
        excludes:
          - Info.plist
      - path: Sources/Ayami/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.xcassets
        buildPhase: resources
    dependencies:
      - package: Textual
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Tests/AyamiIOSUITestHost/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewer.UITestHost
        PRODUCT_MODULE_NAME: AyamiUITestHost
        CURRENT_PROJECT_VERSION: "19"
        MARKETING_VERSION: "1.4"
        TARGETED_DEVICE_FAMILY: "1,2"

  AyamiQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AyamiQuickLook
      - path: Sources/Ayami/OutputDocument.swift
      - path: Sources/Ayami/OutputTextStyle.swift
      - path: Sources/Ayami/DocumentPDFGenerator.swift
      - path: Sources/Ayami/MermaidPDFRenderer.swift
      - path: Sources/Ayami/MermaidRendererResources.swift
      - path: Sources/Ayami/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Packaging/AyamiQuickLook.entitlements
        CURRENT_PROJECT_VERSION: "19"
        DEVELOPMENT_TEAM: ZLX73742D3
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info-QuickLook.plist
        MARKETING_VERSION: "1.4"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewer.QuickLook
        PRODUCT_MODULE_NAME: AyamiQuickLook
        PRODUCT_NAME: AyamiQuickLook
        SKIP_INSTALL: YES
      configs:
        UIValidation:
          ENABLE_DEBUG_DYLIB: NO
          PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.AyamiMacUITestHost.QuickLook
          INFOPLIST_FILE: Tests/AyamiMacUITests/QuickLook-Info.plist

  AyamiMacUITestHost:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ayami
        excludes:
          - Resources
      - path: Sources/Ayami/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.xcassets
        buildPhase: resources
      - path: Packaging/Localizations
        buildPhase: resources
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Legal
        buildPhase: resources
        type: folder
    dependencies:
      - package: Textual
      - target: AyamiQuickLook
        embed: true
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Packaging/Ayami.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "19"
        DEVELOPMENT_TEAM: ZLX73742D3
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tests/AyamiMacUITests/Host-Info.plist
        MARKETING_VERSION: "1.4"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.AyamiMacUITestHost
        PRODUCT_MODULE_NAME: AyamiMacUITestHost
        PRODUCT_NAME: AyamiMacUITestHost
        SWIFT_STRICT_CONCURRENCY: complete

  AyamiMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/AyamiMacUITests
        excludes:
          - Host-Info.plist
          - QuickLook-Info.plist
          - Fixtures
    dependencies:
      - target: AyamiMacUITestHost
    settings:
      base:
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.AyamiMacUITests
        TEST_TARGET_NAME: AyamiMacUITestHost

  AyamiIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AyamiIOSUITests
    dependencies:
      - target: AyamiIOSUITestHost
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewerIOSUITests
        TEST_TARGET_NAME: AyamiIOSUITestHost

schemes:
  AyamiMacUIValidation:
    build:
      targets:
        AyamiMacUITestHost: all
    run:
      config: UIValidation
    test:
      config: UIValidation
      environmentVariables:
        AYAMI_KEEP_PREVIEW_OPEN: "$(AYAMI_KEEP_PREVIEW_OPEN)"
      targets:
        - AyamiMacUITests
  AyamiIOS:
    build:
      targets:
        AyamiIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AyamiIOSTests
        - AyamiIOSUITests
    archive:
      config: Release
  Ayami:
    build:
      targets:
        Ayami: all
        AyamiTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AyamiTests
    archive:
      config: Release
